name: Backtest
on:
  workflow_dispatch:
    inputs:
      days: {description: "Days of 5-min history (Angel)", default: "365"}
  schedule:
    - cron: "37 4 * * 6"   # Saturday 10:07 IST – weekly re-check on the newest data
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Kolkata
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
      ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
      ANGEL_MPIN: ${{ secrets.ANGEL_MPIN }}
      ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
      SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
      SHEET_TOKEN: ${{ secrets.SHEET_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - name: Run backtest
        run: |
          if [ -n "${{ github.event.inputs.days }}" ]; then sed -i "s/^  days: .*/  days: ${{ github.event.inputs.days }}/" config.yaml; fi
          python main.py backtest
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: backtest-report, path: reports/}
      - name: Report in run summary
        if: always()
        run: cat reports/backtest_report.md >> $GITHUB_STEP_SUMMARY || true
